[package]
name = "orca-server"
version = "0.1.18"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
include_dir = "0.7.4"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", default-features = false }
roxmltree = "0.21"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stl_io = "0.11.0"
suppaftp = { version = "12.0.1", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["v4"] }
webpki = { version = "0.103.15", package = "rustls-webpki", default-features = false, features = ["ring", "std"] }
x509-cert = { version = "0.3.0", default-features = false, features = ["std"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = false
strip = true
codegen-units = 16
