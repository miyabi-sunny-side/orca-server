[package]
name = "orca-server"
version = "0.1.2"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
include_dir = "0.7.4"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stl_io = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = false
strip = true
codegen-units = 16
